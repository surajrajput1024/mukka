<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mohalla Mukka · मोहल्ला मुक्का</title>
<meta name="description" content="Free 1v1 street-brawl in your browser. Funny fictional nukkad characters, vs computer or a friend, with sound. Ek aur round? मुफ़्त, बिना लॉगिन।">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2a0f4a">
<meta property="og:title" content="Mohalla Mukka · मोहल्ला मुक्का"><meta property="og:description" content="Fictional nukkad slapstick brawl. Beat my score!"><meta property="og:image" content="https://surajrajput1024.github.io/mukka/icon-512.png">
<style>
:root{--bg:#2a0f4a;--acc:#ffd60a;--tx:#fff}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 12px 12px;text-align:center;overflow:auto;background:rgba(20,6,40,.82)}
.card{max-width:520px;width:100%}
h1{margin:0;font-size:38px;line-height:1.05;color:var(--acc);text-shadow:0 3px 0 #b23a00}
p{margin:6px 0;color:#e8dcff}
button{font:inherit;border:0;border-radius:14px;color:#fff;cursor:pointer;touch-action:manipulation}
.big{background:var(--acc);color:#2a1500;font-weight:800;font-size:19px;padding:13px 18px;width:100%;margin-top:8px}
.sec{background:rgba(255,255,255,.16);padding:10px 14px;font-size:15px}
.top{position:fixed;top:max(6px,env(safe-area-inset-top));right:8px;display:flex;gap:6px;z-index:5}
.top button{background:rgba(20,6,40,.7);padding:7px 10px;font-size:15px;min-width:38px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ch{background:rgba(255,255,255,.12);padding:6px 4px;font-size:12px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;color:#fff}
.ch canvas{width:64px;height:76px}
.ch.on{border-color:var(--acc)}
.lv.on{outline:3px solid var(--acc)}
.dsc{font-size:12px;color:#cdbbff;min-height:32px}
#pads{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
.pad{position:absolute;bottom:10px;display:grid;gap:6px;pointer-events:auto}
.pad.l{left:8px}.pad.r{right:8px}
.pad button{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);font-size:22px;width:58px;height:58px;padding:0;border-radius:50%;position:relative;overflow:hidden}
.pad button.dn{background:rgba(255,214,10,.7)}
.pad.small{gap:4px}.pad.small button{width:38px;height:38px;font-size:15px;border-width:1px}
.pad button i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,214,10,.55);height:0;pointer-events:none}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
a{color:#b9a2ff}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Mohalla Mukka game"></canvas>
<div class="top"><button id="pause" aria-label="pause" hidden>⏸</button><button id="lang"></button><button id="pack" aria-label="sound pack">🤪</button><button id="mus" aria-label="music">♪</button><button id="snd" aria-label="sound">🔊</button></div>
<div id="pads" hidden></div>
<div class="ov" id="menu"><div class="card">
<h1 id="m-name"></h1><p id="m-sub"></p><p id="m-friend" hidden style="color:var(--acc);font-weight:700"></p>
<button class="big" id="b-cpu"></button><button class="big" id="b-2p" style="background:#6fd3ff"></button><button class="big" id="b-rush" style="background:#ff8fa3"></button>
<p style="margin-top:12px"><span id="m-diff"></span></p><div class="row" id="lv"></div>
<p id="m-best" style="font-size:14px"></p><p id="m-how" style="font-size:12px"></p><p id="m-fic" style="font-size:12px;opacity:.8"></p>
<p style="font-size:12px"><a id="priv" href="privacy.html"></a></p></div></div>
<div class="ov" id="pick" hidden><div class="card"><p id="p-title" style="font-size:20px;font-weight:800;color:var(--acc);margin:0"></p><div class="grid" id="grid"></div><p class="dsc" id="p-dsc"></p><button class="big" id="p-go"></button><button class="sec" id="p-back" style="margin-top:6px;width:100%"></button></div></div>
<div class="ov" id="end" hidden style="background:rgba(20,6,40,.7)"><div class="card">
<p id="e-msg" style="font-size:28px;font-weight:900;color:var(--acc);margin:0"></p><div id="e-score" style="font-size:64px;font-weight:900;line-height:1.1"></div><p id="e-info"></p>
<button class="big" id="again"></button><button class="sec" id="e-share" style="margin-top:8px;width:100%"></button><button class="sec" id="e-menu" style="margin-top:6px;width:100%"></button></div></div>
<div class="ov" id="paused" hidden style="z-index:6"><div class="card"><p id="pz" style="font-size:28px;font-weight:800"></p><button class="big" id="resume"></button><button class="sec" id="pz-menu" style="margin-top:6px;width:100%"></button></div></div>
<script src="config.js"></script><script src="i18n.js"></script><script src="logic.js"></script><script src="audio.js"></script><script src="game.js"></script>
</body></html>
